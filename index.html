<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPIK 闪卡</title>
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOPIK闪卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0f1419;--card:#1a2332;--card2:#222e42;--ink:#eef3fa;--muted:#93a3bb;--accent:#4f8cff;--ok:#2ecc71;--bad:#ff6b6b;--warn:#f0c14b;--border:#2e3f58;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.5;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header h1{font-size:1.15rem;margin:0;flex:0 0 auto}
header select{flex:1;min-width:0}
select{font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink);appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.modes button{min-height:46px;border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:12px;font-size:16px;font-weight:600}
.modes button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;margin:4px 2px 8px}
.bar b{color:var(--ink)}
.bar .sp{flex:1}
.progress{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px 16px 16px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.label{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.label .tag{margin-left:auto;background:var(--card2);padding:2px 8px;border-radius:999px;font-size:12px}
.prompt{font-size:30px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;margin:4px 0 8px;min-height:1.4em}
.prompt.sent{font-size:22px;line-height:1.5}
.speak{border:none;background:var(--card2);color:var(--ink);border-radius:10px;font-size:18px;min-width:44px;min-height:40px;vertical-align:middle}
.hintline{min-height:24px;color:var(--muted);font-size:15px;margin-bottom:10px}
.hintline button{border:1px dashed var(--border);background:none;color:var(--muted);border-radius:8px;padding:4px 10px;font-size:14px}
textarea.answer{display:block;width:100%;font-size:20px;line-height:1.45;padding:14px;border-radius:14px;border:2px solid var(--border);background:#0b1017;color:var(--ink);outline:none;resize:none;font-family:inherit}
textarea.answer:focus{border-color:var(--accent)}
textarea.answer:disabled{opacity:.75}
.feedback{margin-top:12px;font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.feedback:empty{display:none}
.feedback .big{font-size:22px;font-weight:700;color:var(--ink)}
.feedback.ok .title{color:var(--ok);font-weight:700}
.feedback.bad .title{color:var(--bad);font-weight:700}
.feedback .sub{color:var(--muted);font-size:15px;margin-top:6px}
.feedback .teacher{margin-top:8px;padding:8px 10px;border-radius:10px;background:#2a2a1a;color:var(--warn);font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions button,.btn{min-height:54px;border:none;border-radius:14px;font-size:18px;font-weight:700;color:#fff;background:var(--card2)}
.actions button.full{grid-column:1/-1}
.b-primary{background:var(--accent)!important}
.b-ok{background:#1f7a47!important}
.b-bad{background:#9b3340!important}
.b-ghost{background:var(--card2)!important;color:var(--muted)!important;font-weight:600!important}
.small{min-height:44px!important;font-size:15px!important}
.summary h2{margin:0 0 6px;font-size:24px}
.summary .nums{font-size:18px;margin-bottom:10px}
.list{margin:10px 0 0;padding:0;list-style:none;max-height:45vh;overflow:auto;border-top:1px solid var(--border)}
.list li{padding:8px 2px;border-bottom:1px solid var(--border);font-size:16px}
.list li .ko{font-weight:700}
.list li .zh{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
footer button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.label .tag.pos{background:#23324a;color:#9cc2ff;border:1px solid #35527e}
.posb{display:inline-block;font-size:12px;line-height:1.4;padding:1px 8px;border-radius:999px;background:#23324a;color:#9cc2ff;border:1px solid #35527e;font-weight:600;vertical-align:middle;white-space:nowrap}
details.wi{margin-top:12px;border:1px solid var(--border);border-radius:14px;background:#141c29;overflow:hidden}
details.wi>summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:44px}
details.wi>summary::-webkit-details-marker{display:none}
details.wi>summary::after{content:"▾";margin-left:auto;transition:transform .2s}
details.wi[open]>summary::after{transform:rotate(180deg)}
details.wi.hot{border-color:#7a3a45;background:#1e1a24;box-shadow:0 0 0 1px #7a3a4555 inset}
details.wi.hot>summary{color:#ffb3b3}
.wi .body{padding:0 12px 12px;font-size:15px;line-height:1.6;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.wi .row{margin-top:8px}
.wi .k{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:2px;letter-spacing:.02em}
.wi .hj{font-size:17px;font-weight:700;color:#ffd98a}
.wi .tipbox{background:#2a2a1a;color:var(--warn);border-radius:10px;padding:7px 10px;margin-top:8px}
.wi .chips{display:flex;flex-wrap:wrap;gap:6px}
.wi .chip{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:3px 9px;font-size:14.5px}
.wi .chip b{font-weight:700}
.wi .chip span{color:var(--muted)}
.wi .chip.ant{border-color:#5b3a44}
.list li .mem{color:var(--ink);font-size:14.5px;margin-top:3px;opacity:.9}
.list li .mem .t{color:var(--warn)}

/* ---------- 顶部切换 + 写作 ---------- */
.topnav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:10px}
.topnav button{min-height:42px;border:none;border-radius:10px;background:none;color:var(--muted);font-size:15px;font-weight:700;padding:0 2px;white-space:nowrap}
.topnav button.active{background:var(--accent);color:#fff}
.wtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.mlhint{margin:4px 0 2px;font-size:13.5px;color:var(--warn);background:#2a2a1a;border-radius:8px;padding:5px 8px}
.mlbox{margin-top:10px;border:1px solid #6b5a1e;background:#221f12;border-radius:10px;padding:8px 10px;font-size:14px}
.mlbox .mh{font-weight:700;color:var(--warn);margin-bottom:4px}
.mlit{border-top:1px dashed #4a4020;padding:6px 0 2px}.mlit:first-of-type{border-top:0}
.mlit .ma{color:var(--bad)}.mlit .mf{color:var(--ok)}.mlit .mc{color:var(--ink)}.mlit .mt{font-size:12px;color:var(--muted)}
.mlchip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:#3a3218;color:#f5d67a;margin:2px 4px 0 0}
.mtype{border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--card)}
.mtype>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:700}
.mtype>summary::-webkit-details-marker{display:none}
.mtype .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;padding:1px 9px;font-size:13px}
.mtype .rule{padding:0 12px 6px;color:var(--warn);font-size:14.5px}
.mtype .ex{padding:6px 12px;border-top:1px solid var(--border);font-size:14px;cursor:pointer}
.mtype .ex .src{font-size:12.5px;color:var(--accent)}
.wtabs button{min-height:44px;border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:12px;font-size:14px;font-weight:600;padding:0 2px}
.wtabs button.active{background:var(--card2);border-color:var(--accent);color:#fff;box-shadow:0 0 0 1px var(--accent) inset}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.seg button{flex:1 1 auto;min-height:38px;padding:0 10px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;font-size:14.5px;font-weight:600}
.seg button.active{background:#23324a;border-color:#4f8cff;color:#cfe0ff}
.seg button:disabled{opacity:.4}
.wrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wrow select{flex:1;min-width:0;font-size:15px;padding:9px 30px 9px 10px}
.wrow label{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.wrow input[type=checkbox]{width:20px;height:20px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.qhead .no{font-size:20px;font-weight:800}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.real{background:#1d3326;border-color:#2f6b45;color:#8fe0ae}
.badge.rec{background:#33301d;border-color:#6b612f;color:#f0dc8f}
.badge.mock{background:#2d2340;border-color:#5a4585;color:#cbb6ff}
.qtitle{font-weight:700;margin:2px 0 6px;font-size:17px}
.passage{font-size:17.5px;line-height:1.85;background:#111926;border:1px solid var(--border);border-radius:14px;padding:12px 13px;word-break:keep-all;overflow-wrap:anywhere}
.passage .blank{display:inline-block;min-width:3.2em;text-align:center;padding:0 6px;margin:0 2px;border-radius:8px;background:#2b3b58;color:#ffd98a;font-weight:800;line-height:1.5}
.passage .blank.b{background:#3b2b4d;color:#e2c2ff}
.wfield{margin-top:12px}
.wfield .lab{font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.wfield textarea{min-height:64px}
.reveal{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.reveal .ansbox{border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-top:10px;background:#141c29}
.reveal .ansbox .h{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:4px}
.reveal .model{font-size:18px;font-weight:700;color:#bff0cf;line-height:1.55}
.reveal .model.alt{font-size:15.5px;font-weight:600;color:#cfe0ff}
.reveal .mine{font-size:15px;color:var(--muted);margin-top:4px}
.reveal .exp{font-size:15px;margin-top:6px;line-height:1.6}
.reveal .pat{display:inline-block;margin-top:6px;font-size:14px;background:#23324a;border:1px solid #35527e;color:#9cc2ff;border-radius:10px;padding:2px 9px}
.reveal .zh{font-size:15px;color:var(--ink);opacity:.92;line-height:1.7;background:#141c29;border-radius:12px;padding:10px 12px;margin-top:10px}
.reveal .note{font-size:14px;color:var(--warn);background:#2a2a1a;border-radius:10px;padding:7px 10px;margin-top:8px}
.marks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.marks button{min-height:40px;border:1px solid var(--border);background:var(--card2);color:var(--ink);border-radius:10px;font-size:15px;font-weight:700}
.marks button.on[data-m=full]{background:#1f7a47;border-color:#1f7a47}
.marks button.on[data-m=part]{background:#8a6d1f;border-color:#8a6d1f}
.marks button.on[data-m=none]{background:#9b3340;border-color:#9b3340}
.mk{font-size:12px;padding:1px 7px;border-radius:999px;font-weight:700}
.mk.full{background:#1f7a47;color:#fff}.mk.part{background:#8a6d1f;color:#fff}.mk.none{background:#9b3340;color:#fff}
.wnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cs{font-size:15.5px;line-height:1.65}
.cs h3{font-size:17px;margin:18px 0 8px;color:#cfe0ff}
.cs h3:first-child{margin-top:0}
.cs ol,.cs ul{padding-left:1.3em;margin:6px 0}
.cs li{margin:5px 0}
.cs code{font-family:inherit;background:#23324a;color:#ffd98a;border-radius:6px;padding:0 5px;white-space:nowrap}
.cs .tip{background:#2a2a1a;color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0}
.tbl th,.tbl td{border:1px solid var(--border);padding:6px 7px;vertical-align:top;text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.tbl th{background:var(--card2);color:var(--muted);font-weight:700}
.tbl td:first-child{white-space:nowrap}
.tbl code{white-space:normal}
.tbl.f td:first-child{white-space:normal;min-width:6.5em}
.wlist li{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.wlist li .t{flex:1;min-width:0}
.wlist li .s{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 写作速查 v2 ---------- */
#wCheat.card{padding:12px 12px 14px}
.cs2{font-size:15.5px;line-height:1.65}
.cs2 .k{color:#ffd98a;font-weight:600}
.cs-search{position:relative;margin-bottom:8px}
.cs-search input{width:100%;font-size:16px;padding:11px 40px 11px 12px;border-radius:12px;border:1px solid var(--border);background:#0b1017;color:var(--ink);outline:none}
.cs-search input:focus{border-color:var(--accent)}
.cs-search button{position:absolute;right:4px;top:4px;bottom:4px;width:36px;border:none;background:none;color:var(--muted);font-size:16px}
.cs-tabs button{font-size:14px;min-height:40px}
.cs-lead{color:var(--muted);font-size:14px;margin:4px 2px 8px}
.cs-h{margin:14px 2px 6px;font-size:15px;color:#9cc2ff;letter-spacing:.02em}
.cs-empty{color:var(--muted);text-align:center;padding:20px}
.fms{display:flex;flex-direction:column;gap:8px}
.fm{background:#141c29;border:1px solid var(--border);border-radius:12px;padding:9px 11px}
.fm-l,.fm-r{display:flex;gap:8px;align-items:baseline}
.fm-r{margin-top:2px;font-weight:700}
.fm-tag{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#23324a;color:#9cc2ff}
.fm-tag.w{background:#1d3326;color:#8fe0ae}
.fm-ex{margin-top:5px;font-size:14.5px;color:var(--ink);opacity:.92;word-break:keep-all;overflow-wrap:anywhere}
.fm-src,.exsrc{display:inline-block;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;margin-left:4px;white-space:nowrap}
.cs2 mark,.wg mark{background:#4a3f12;color:#ffe9a6;border-radius:4px;padding:0 2px}
details.grp{border:1px solid var(--border);border-radius:14px;margin:8px 0;background:#141c29;overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 12px;min-height:48px}
details.grp>summary::-webkit-details-marker,details.pc>summary::-webkit-details-marker{display:none}
details.grp>summary b{font-size:16px}
details.grp>summary .gd{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.grp>summary .gn{font-size:12px;background:var(--card2);border-radius:999px;padding:1px 8px;color:var(--muted)}
details.grp>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.grp[open]>summary::after{transform:rotate(180deg)}
.grp-b{padding:0 8px 8px}
details.pc{border-top:1px solid var(--border)}
details.pc>summary{list-style:none;cursor:pointer;padding:10px 4px;display:flex;flex-direction:column;gap:1px}
details.pc>summary .pk{font-size:18px;font-weight:800;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
details.pc>summary .pz{font-size:14px;color:var(--muted)}
details.pc[open]>summary .pk{color:#ffd98a}
.pb,.wgc{padding:2px 4px 10px;font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.pb .row,.wgc .row{margin-top:8px}
.rk{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:1px}
.row.mem{background:#1b2436;border-radius:10px;padding:7px 9px}
.row.cue{background:#16271f;border-radius:10px;padding:7px 9px}
.row.err{background:#2a2a1a;color:var(--warn);border-radius:10px;padding:7px 9px}
.row.err .k{color:#ffe9a6}
.ex{border-left:3px solid #35527e;padding:2px 0 2px 9px;margin:4px 0 8px}
.exko{font-size:16px}
.exzh{color:var(--muted);font-size:14px}
.exsrc{margin-left:0}
.exsrc.self{border-style:dashed}
.exnote{font-size:13px;color:var(--warn)}
.hon{display:flex;flex-direction:column}
.hon-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:8px 4px;border-top:1px solid var(--border)}
.hon-r .hp{color:var(--muted)}
.hon-r .hh{font-weight:800;font-size:17px;color:#ffd98a}
.hon-r .hz{font-size:14px}
.hon-r .hn{flex-basis:100%;font-size:13px;color:var(--muted)}
.mst{background:#141c29;border:1px solid var(--border);border-radius:12px;padding:10px 11px;margin:8px 0}
.mst .mt{font-weight:800;font-size:16px}
.mst .md{font-size:14.5px;margin-top:3px}
.prs{list-style:none;padding:0;margin:6px 0 0}
.prs li{display:flex;flex-direction:column;padding:5px 0;border-top:1px dashed var(--border);font-size:15px}
.prs .x{color:#ff9b9b;text-decoration:line-through;text-decoration-color:#ff6b6b88}
.prs .o{color:#8fe0ae;font-weight:700}
.steps{padding-left:1.3em}.steps li{margin:6px 0}
/* ---------- 语法闪卡 ---------- */
.wg .prompt{font-size:24px}
.wg .prompt[lang=ko]{font-size:26px}
.wg .cueline{background:#16271f;border-radius:10px;padding:7px 10px;font-size:14.5px;margin:4px 0 10px}
.wg .fbx{margin-top:12px}
.wg .fbx .title{font-weight:800;font-size:18px}
.wg .fbx.ok .title{color:var(--ok)}.wg .fbx.bad .title{color:var(--bad)}
.wg .ansline{font-size:20px;font-weight:800;color:#ffd98a;margin-top:4px}
.wg .mine{color:var(--muted);font-size:14.5px}
.wg details.wi .body{padding-top:4px}
</style>

</head>
<body>
<div class="wrap">
  <nav class="topnav" id="topnav">
    <button type="button" data-view="flash">📇 闪卡</button>
    <button type="button" data-view="writing">✍️ 写作</button>
    <button type="button" data-view="reading">📖 阅读</button>
    <button type="button" data-view="grammar">🧩 语法</button>
  </nav>
  <div id="flash">
  <header>
    <h1>TOPIK 闪卡</h1>
    <select id="deckSel" aria-label="选择题库"><option>加载中…</option></select>
  </header>
  <div class="modes" id="modes">
    <button data-mode="v_zh_ko">单词 中→韩</button>
    <button data-mode="v_ko_zh">单词 韩→中</button>
  </div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var LS_MODE="topik.mode", LS_WRONG="topik.wrong.v1";
var MODE_INFO={
  v_zh_ko:{label:"中文 → 写韩语单词", ph:"输入韩语…", inLang:"ko", type:"v"},
  v_ko_zh:{label:"韩语 → 写中文意思", ph:"输入中文意思（可留空直接看答案）", inLang:"zh-CN", type:"v"}
};   /* 闪卡只练单词；语法见「🧩 语法」模块。旧的语法句模式/深链接回落到 单词 中→韩 */
var index=[], CATS=[], cache={}, WI={}, mode=localStorage.getItem(LS_MODE)||"v_zh_ko";
if(!MODE_INFO[mode]) mode="v_zh_ko";
var source="latest";            // "latest" | date | "cat-<slug>" | "all" | "wrong"
/* 深链接：?cat=taste  ?deck=2026-09-29  &mode=zh2ko|ko2zh（旧的 gko2zh|gzh2ko → zh2ko） */
var QS=(function(){var o={};location.search.replace(/^\?/,"").split("&").forEach(function(kv){if(!kv)return;var i=kv.indexOf("=");o[decodeURIComponent(i<0?kv:kv.slice(0,i))]=decodeURIComponent(i<0?"":kv.slice(i+1).replace(/\+/g," "))});return o})();
var MODE_ALIAS={zh2ko:"v_zh_ko",ko2zh:"v_ko_zh",gko2zh:"v_zh_ko",gzh2ko:"v_zh_ko",v_zh_ko:"v_zh_ko",v_ko_zh:"v_ko_zh",g_ko_zh:"v_zh_ko",g_zh_ko:"v_zh_ko"};
if(/^(writing-grammar|writing-5354|grammar-core)$/.test(String(QS.cat||"").toLowerCase())||QS.reading||QS.grammar||QS.writing){QS.cat=null;QS.mode=null}   // 写作语法闪卡：交给写作模块处理
if(QS.mode&&MODE_ALIAS[QS.mode]){mode=MODE_ALIAS[QS.mode];try{localStorage.setItem(LS_MODE,mode)}catch(e){}}
if(QS.cat) source="cat-"+String(QS.cat).toLowerCase().replace(/[^a-z0-9-]/g,"");
else if(QS.deck) source=QS.deck;
if(QS.cat||QS.deck){try{localStorage.setItem("topik.view","flash")}catch(e){}}
var wantSource=source;
var pool=[], queue=[], pos=0, ok=0, bad=0, missed=[], written=[], state="idle", cur=null, isRedo=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},1600)}
function bust(u){return u+(u.indexOf("?")<0?"?":"&")+"v="+Date.now()}
function getJSON(u){return fetch(bust(u),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status+" "+u);return r.json()})}
function mmdd(d){d=String(d||"");if(d.indexOf("cat-")===0){var c=catById(d);return c?(c.emoji?c.emoji+" ":"")+c.name:d.slice(4)}var p=d.split("-");return p.length<3?d:(+p[1])+"/"+(+p[2])}
function catById(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return null}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- 错题本 ---------- */
function loadWrong(){try{return JSON.parse(localStorage.getItem(LS_WRONG))||{}}catch(e){return {}}}
function saveWrong(w){try{localStorage.setItem(LS_WRONG,JSON.stringify(w))}catch(e){}}
function cardKey(c){return c.t+"|"+c.ko}
function recordWrong(c){
  var w=loadWrong(),k=cardKey(c),e=w[k]||{t:c.t,ko:c.ko,zh:c.zh,hint:c.hint,ex:c.ex,exzh:c.exzh,point:c.point,date:c.date,m:{}};
  e.zh=c.zh; e.m[mode]=(e.m[mode]||0)+1; e.last=Date.now(); w[k]=e; saveWrong(w);
}
function recordRight(c){
  if(source!=="wrong") return;             // only clear when drilling the 错题本
  var w=loadWrong(),k=cardKey(c),e=w[k]; if(!e) return;
  delete e.m[mode]; if(!Object.keys(e.m).length) delete w[k]; saveWrong(w);
}
function wrongCards(m){
  var w=loadWrong(),out=[];
  Object.keys(w).forEach(function(k){var e=w[k];if(e.t==="v"&&e.m&&e.m[m]) out.push({t:e.t,ko:e.ko,zh:e.zh,hint:e.hint,ex:e.ex,exzh:e.exzh,point:e.point,date:e.date})});
  return out;
}

/* ---------- 匹配（仅 单词中→韩 自动核对） ---------- */
function norm(s){
  return String(s||"").normalize("NFC").toLowerCase()
    .replace(/[\s\u00a0\u3000]+/g,"")
    .replace(/[.,!?;:'"`~()\[\]{}<>«»…·\-_\/\\\u2018\u2019\u201c\u201d\u3001-\u303f\uff00-\uff0f\uff1a-\uff20\uff3b-\uff40\uff5b-\uff65]/g,"");
}
function variants(ans){
  var s=String(ans).replace(/[（(][^）)]*[）)]/g," ");
  var vs=s.split(/[、,，\/;；|]| 또는 /).map(norm).filter(Boolean);
  vs.push(norm(ans)); vs.push(norm(s));
  return vs;
}
function match(user,ans){var u=norm(user);if(!u)return false;return variants(ans).indexOf(u)>=0}

/* ---------- 词汇信息（词性/记忆法/近反义词） ---------- */
var INFO_KEYS=["pos","hanja","mem","tip","syn","ant"];
function info(c){ // card fields win, wordinfo.json fills gaps (e.g. old 错题本 entries)
  if(!c||c.t!=="v") return null;
  var w=WI[c.ko]||{},o={},any=false;
  INFO_KEYS.forEach(function(k){var v=(c[k]!=null&&c[k]!==""&&!(Array.isArray(c[k])&&!c[k].length))?c[k]:w[k];if(v!=null&&v!==""){o[k]=v;if(!(Array.isArray(v)&&!v.length))any=true}});
  return any?o:null;
}
function posBadge(c){var i=info(c);return i&&i.pos?'<span class="posb">'+esc(i.pos)+"</span>":""}
function chips(list,cls){
  return '<div class="chips">'+list.map(function(x){
    if(typeof x==="string") return '<span class="chip '+cls+'" lang="ko">'+esc(x)+"</span>";
    return '<span class="chip '+cls+'"><b lang="ko">'+esc(x.ko)+"</b>"+(x.zh?" <span>"+esc(x.zh)+"</span>":"")+"</span>";
  }).join("")+"</div>";
}
function infoHTML(c,open){
  var i=info(c); if(!i) return "";
  var b="";
  if(i.pos||i.hanja) b+='<div class="row">'+(i.pos?'<span class="posb">'+esc(i.pos)+"</span> ":"")+(i.hanja?'<span class="k" style="display:inline;margin-left:4px">汉字</span> <span class="hj">'+esc(i.hanja)+"</span>":"")+"</div>";
  if(i.mem) b+='<div class="row"><span class="k">🧠 记忆法</span>'+esc(i.mem)+"</div>";
  if(i.tip) b+='<div class="tipbox">⚠️ 易错：'+esc(i.tip)+"</div>";
  if(i.syn&&i.syn.length) b+='<div class="row"><span class="k">≈ 近义词 / 同类词</span>'+chips(i.syn,"syn")+"</div>";
  if(i.ant&&i.ant.length) b+='<div class="row"><span class="k">⇄ 反义词</span>'+chips(i.ant,"ant")+"</div>";
  return '<details class="wi'+(open?" hot":"")+'" id="wi"'+(open?" open":"")+'><summary>📖 词性·记忆法·近反义词</summary><div class="body">'+b+"</div></details>";
}
function openInfo(){var d=$("wi");if(d){d.open=true;d.classList.add("hot");try{d.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}}}

/* ---------- 数据 ---------- */
function deckCards(d){
  var out=[];
  (d.vocab||[]).forEach(function(v){var c={t:"v",ko:v.ko,zh:v.zh,hint:v.hint,ex:v.ex,exzh:v.exzh,date:d.date};INFO_KEYS.forEach(function(k){if(v[k]!=null)c[k]=v[k]});out.push(c)});
  // 每日/分类 JSON 里的 grammar 句子不再进闪卡（只练单词）
  return out;
}
function loadDeck(date){
  if(cache[date]) return Promise.resolve(cache[date]);
  return getJSON("decks/"+date+".json").then(function(d){cache[date]=d;return d});
}
function loadWI(){return getJSON("wordinfo.json").then(function(w){WI=w||{}}).catch(function(){WI={}})}
function loadIndex(){
  var cats=getJSON("decks/categories.json").then(function(c){CATS=c||[]}).catch(function(){CATS=[]});
  return Promise.all([getJSON("decks/index.json").then(function(ix){index=ix||[]}),cats]).then(renderDeckSel);
}
function renderDeckSel(){
  var sel=$("deckSel"),h=[],t=todayStr();
  if(index.length){
    var n=index[0];
    h.push('<option value="latest">'+(n.date===t?"今天":"最新")+" · "+mmdd(n.date)+(n.theme?" "+esc(n.theme):"")+"</option>");
    index.slice(1).forEach(function(e){h.push('<option value="'+e.date+'">'+mmdd(e.date)+(e.theme?" · "+esc(e.theme):"")+"</option>")});
  }
  if(index.length||CATS.length){
    if(CATS.length){
      h.push('<optgroup label="分类">');
      CATS.forEach(function(c){h.push('<option value="'+esc(c.id)+'">'+esc((c.emoji?c.emoji+" ":"")+c.name)+"（"+c.vocab+" 词）</option>")});
      h.push("</optgroup>");
    }
    h.push('<option value="all">全部混合（'+index.length+" 天"+(CATS.length?" + "+CATS.length+" 类":"")+"）</option>");
  }
  h.push('<option value="wrong">错题本（'+wrongCards(mode).length+"）</option>");
  sel.innerHTML=h.join("");
  if(wantSource){source=wantSource;wantSource=null;if(source!=="latest"&&!Array.prototype.some.call(sel.options,function(o){return o.value===source}))toast("找不到这个题库，已打开最新一天")}
  sel.value=source; if(sel.value!==source){source="latest";sel.value="latest"}
  var sh=$("shareCat"); if(sh) sh.hidden=!(source.indexOf("cat-")===0||/^\d{4}-/.test(source));
}
function getPool(){
  var type=MODE_INFO[mode].type;
  if(source==="wrong") return Promise.resolve(wrongCards(mode));
  if(!index.length&&!CATS.length) return Promise.resolve([]);
  var dates = source==="all" ? index.map(function(e){return e.date}).concat(CATS.map(function(c){return c.id}))
            : [source==="latest"?(index[0]||{}).date:source];
  return Promise.all(dates.map(loadDeck)).then(function(ds){
    var seen={},out=[];
    ds.forEach(function(d){deckCards(d).forEach(function(c){if(c.t!==type)return;var k=cardKey(c);if(seen[k])return;seen[k]=1;out.push(c)})});
    return out;
  });
}

/* ---------- 流程 ---------- */
function start(cards,redo){
  isRedo=!!redo; queue=shuffle(cards); pos=0; ok=0; bad=0; missed=[]; written=[];
  $("summary").hidden=true; $("quiz").hidden=false;
  if(!queue.length){
    $("quiz").hidden=true; var s=$("summary"); s.hidden=false;
    s.innerHTML='<div class="empty">'+(source==="wrong"?"这个模式的错题本是空的 🎉<br>去练新卡吧。":"这个题库里没有单词卡。")+"</div>";
    updateBar(); return;
  }
  show();
}
function reload(){
  var info=$("deckInfo"); info.textContent="加载中…";
  return getPool().then(function(p){pool=p;start(pool);info.textContent=deckLabel()+" · "+pool.length+" 张"})
    .catch(function(e){info.textContent="加载失败："+e.message+"（下拉刷新重试）"});
}
function deckLabel(){var o=$("deckSel").selectedOptions[0];return o?o.textContent:""}
function updateBar(){
  var n=queue.length,i=Math.min(pos+(state==="done"?0:1),n);
  $("prog").textContent=(n?i:0)+"/"+n; $("okN").textContent=ok; $("badN").textContent=bad;
  $("progBar").style.width=(n?(pos/n*100):0)+"%";
}
function setActions(list){
  $("actions").innerHTML=list.map(function(b,i){return '<button type="button" data-i="'+i+'" class="'+(b.cls||"")+'">'+b.text+"</button>"}).join("");
  $("actions").onclick=function(e){var el=e.target.closest("button[data-i]");if(el) list[+el.getAttribute("data-i")].fn()};
}
function canSpeak(){return "speechSynthesis" in window}
function speak(t){if(!canSpeak())return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function autosize(){var a=$("answer");a.style.height="auto";a.style.height=Math.max(a.scrollHeight,54)+"px"}

function show(){
  if(pos>=queue.length) return finish();
  state="ask"; cur=queue[pos];
  var mi=MODE_INFO[mode], koPrompt=(mode==="v_ko_zh"||mode==="g_ko_zh");
  $("label").textContent=mi.label+(source==="all"||source==="wrong"?" · "+mmdd(cur.date||""):"");
  var tag=$("tag"), ci=info(cur); tag.className="tag";
  if(cur.point){tag.hidden=false;tag.textContent=cur.point}
  else if(ci&&ci.pos){tag.hidden=false;tag.className="tag pos";tag.textContent=ci.pos}
  else tag.hidden=true;
  var p=$("prompt"); p.className="prompt"+(cur.t==="g"?" sent":"");
  p.setAttribute("lang",koPrompt?"ko":"zh-CN");
  p.innerHTML=esc(koPrompt?cur.ko:cur.zh)+(koPrompt&&canSpeak()?' <button class="speak" id="spk" aria-label="朗读">🔊</button>':"");
  if($("spk")) $("spk").onclick=function(){speak(cur.ko)};
  var hl=$("hintline"); hl.innerHTML="";
  if(mode==="v_zh_ko"&&cur.hint){hl.innerHTML='<button id="hintBtn">显示提示</button>';$("hintBtn").onclick=function(){hl.textContent="提示："+cur.hint}}
  else if(mode==="g_zh_ko"&&cur.point){hl.textContent="目标语法："+cur.point}
  var a=$("answer"); a.value=""; a.disabled=false; a.placeholder=mi.ph; a.setAttribute("lang",mi.inLang);
  a.rows=cur.t==="g"?2:1; autosize();
  $("fb").className="feedback"; $("fb").innerHTML="";
  if(mode==="v_zh_ko") setActions([{text:"核对",cls:"b-primary",fn:check},{text:"不会 · 看答案",cls:"b-ghost",fn:giveUp}]);
  else setActions([{text:"看参考答案",cls:"b-primary full",fn:check}]);
  updateBar();
  try{a.focus({preventScroll:true})}catch(e){a.focus()}
}
function exLine(){
  var s="";
  if(cur.t==="v"&&cur.ex) s+='<div class="sub" lang="ko">例句：'+esc(cur.ex)+"</div>"+(cur.exzh?'<div class="sub">　　　'+esc(cur.exzh)+"</div>":"");
  return s;
}
function refHTML(){ // reference answer for current direction
  var toKo=(mode==="v_zh_ko"||mode==="g_zh_ko");
  return '<div class="big" lang="'+(toKo?"ko":"zh-CN")+'">'+esc(toKo?cur.ko:cur.zh)+"</div>";
}
function check(){
  if(state!=="ask") return;
  var a=$("answer"), user=a.value.trim(), fb=$("fb");
  if(mode==="v_zh_ko"){
    if(!user){toast("先输入韩语再核对");a.focus();return}
    a.disabled=true;
    if(match(user,cur.ko)){ grade(true,true); return; }
    state="wrong1";
    fb.className="feedback bad";
    fb.innerHTML='<div class="title">✗ 拼写不对</div>你写的：<span lang="ko">'+esc(user)+"</span><br>正确："+refHTML()+exLine()+infoHTML(cur,true);
    setActions([{text:"再试一次",cls:"b-primary",fn:retry},{text:"下一张",cls:"",fn:function(){grade(false)}},
      {text:"其实我写对了（算对）",cls:"b-ghost small full",fn:function(){grade(true)}}]);
    if(canSpeak()) speak(cur.ko);
    return;
  }
  // 自判模式：韩→中（单词/句子）、句子中→韩
  a.disabled=true; state="judge";
  if(user) written.push({zh:cur.zh,point:cur.point,mine:user,ref:cur.ko});
  fb.className="feedback";
  var h=(user?'你写的：<span lang="'+MODE_INFO[mode].inLang+'">'+esc(user)+"</span><br>":"")+"参考："+refHTML()+exLine();
  if(mode==="g_zh_ko"){
    h+='<div class="sub">此模式不自动判分：语法用对、意思一致就算对。</div>';
    if(user) h+='<div class="teacher">✍️ 写好的句子可以发给韩语老师批改</div>';
  } else h+='<div class="sub">意思接近就算对，翻译没有唯一标准。</div>';
  if(cur.t==="v") h+=infoHTML(cur,false);
  fb.innerHTML=h;
  var acts=[{text:"✓ 对",cls:"b-ok",fn:function(){grade(true)}},{text:"✗ 不对",cls:"b-bad",fn:function(){
    if(cur.t==="v"&&$("wi")){ // show the info panel prominently before moving on
      bad++;missed.push(cur);recordWrong(cur);state="wrong2";updateBar();openInfo();
      setActions([{text:"记住了，下一张",cls:"b-primary full",fn:next}]);
    } else grade(false);
  }}];
  if(mode==="g_zh_ko"&&user) acts.push({text:"复制我的句子",cls:"b-ghost small full",fn:function(){copy(user)}});
  setActions(acts);
}
function giveUp(){
  if(state!=="ask") return;
  var user=$("answer").value.trim();
  if(mode!=="v_zh_ko"){ check(); return; }
  $("answer").disabled=true; state="wrong1";
  var fb=$("fb"); fb.className="feedback bad";
  fb.innerHTML='<div class="title">答案</div>'+refHTML()+exLine()+infoHTML(cur,true);
  setActions([{text:"记住了，下一张",cls:"b-primary full",fn:function(){grade(false)}}]);
  if(canSpeak()) speak(cur.ko);
}
function retry(){
  state="ask"; var a=$("answer"); a.disabled=false; a.value=""; $("fb").innerHTML="";
  setActions([{text:"核对",cls:"b-primary",fn:check},{text:"不会 · 看答案",cls:"b-ghost",fn:giveUp}]);
  a.focus();
}
function grade(right,auto){
  if(right){ok++;recordRight(cur)} else {bad++;missed.push(cur);recordWrong(cur)}
  if(auto){
    state="right"; var fb=$("fb"); fb.className="feedback ok";
    fb.innerHTML='<div class="title">✓ 正确！</div>'+refHTML()+exLine()+infoHTML(cur,false);
    setActions([{text:"下一张",cls:"b-primary full",fn:next}]);
    updateBar(); focusNextBtn(); return;
  }
  next();
}

    (i.mem?'<div class="mem">🧠 '+esc(i.mem)+"</div>":"")+(i.tip?'<div class="mem t">⚠️ '+esc(i.tip)+"</div>":"")+"</li>"}).join("")+"</ul>";
  if(mode==="g_zh_ko"&&written.length){
    h+='<div class="teacher" style="margin-top:12px;padding:8px 10px;border-radius:10px;background:#2a2a1a;color:var(--warn)">✍️ 本轮写了 '+written.length+' 句，可以一键复制发给韩语老师批改</div>';

    copy(written.map(function(w,i){return (i+1)+". "+w.zh+(w.point?"（"+w.point+"）":"")+"\n我写的："+w.mine}).join("\n\n"))}});
  var box=$("sumActs");
  box.innerHTML=acts.map(function(b,i){return '<button type="button" data-i="'+i+'" class="'+b.cls+'">'+b.text+"</button>"}).join("");
  box.onclick=function(e){var el=e.target.closest("button[data-i]");if(el)acts[+el.getAttribute("data-i")].fn()};

/* ---------- 事件 ---------- */

});
$("clearWrong").onclick=function(){if(confirm("确定清空所有错题记录？")){saveWrong({});renderDeckSel();if(source==="wrong")reload();toast("已清空")}};
$("reload").onclick=function(){cache={};Promise.all([loadIndex(),loadWI()]).then(reload)};

Array.prototype.forEach.call(document.querySelectorAll("#modes button"),function(b){b.classList.toggle("active",b.getAttribute("data-mode")===mode)});
Promise.all([loadIndex(),loadWI()]).then(reload).catch(function(e){$("deckInfo").textContent="题库加载失败："+e.message});
})();

<script>
/* ---------- 写作 51·52 ---------- */
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var LS_VIEW="topik.view", LS_W="topik.writing.v1", LS_WO="topik.writing.opts";

var opts=load(LS_WO,{no:"all",src:"all",rnd:false,tab:"cheat",cur:null});
if(opts.part!=="5354")opts.part="5152";   // 写作分两部分：51·52（本模块）/ 53·54（writing/w5354.js）

if(st.drafts){delete st.drafts;try{localStorage.setItem(LS_W,JSON.stringify(st))}catch(e){}}   // 不再保存草稿：每次打开题目都是空白

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},1600)}
function copy(t){

  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fallback)}else fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("复制失败，请长按手动复制")}document.body.removeChild(ta)}
}
function bust(u){return u+"?v="+Date.now()}

/* 标签 */

}

function srcGroup(q){return q.kind==="mock"?"mock":(q.src==="recalled"?"recalled":"official")}

/* 视图切换 */
function setView(v,o){
  if(["writing","reading","grammar"].indexOf(v)<0)v="flash";
  $("flash").hidden=v!=="flash"; $("writing").hidden=v!=="writing"; $("reading").hidden=v!=="reading"; $("grammar").hidden=v!=="grammar";
  Array.prototype.forEach.call(document.querySelectorAll("#topnav button"),function(b){b.classList.toggle("active",b.getAttribute("data-view")===v)});
  try{localStorage.setItem(LS_VIEW,v)}catch(e){}
  document.title={writing:opts.part==="5354"?"TOPIK 写作 53·54":"TOPIK 写作 51·52",reading:"TOPIK 阅读真题",grammar:"TOPIK 语法"}[v]||"TOPIK 闪卡";
  if(v==="reading"&&window.TopikReading) TopikReading.open(o||{});

}
function setPart(p,o){

  Array.prototype.forEach.call(document.querySelectorAll("#wpart button"),function(b){b.classList.toggle("active",b.getAttribute("data-part")===p)});
  $("w5152").hidden=p!=="5152"; $("w54").hidden=p!=="5354";
  if(!$("writing").hidden) document.title=p==="5354"?"TOPIK 写作 53·54":"TOPIK 写作 51·52";
  if(p==="5354"){if(window.TopikW54) TopikW54.open(o||{})}
  else ensure().then(function(){setTab(opts.tab||"cheat")});
}
function setTab(t){
  if(["cheat","prac","cards","wrong","mine"].indexOf(t)<0)t="cheat";
  opts.tab=t; save();
  Array.prototype.forEach.call(document.querySelectorAll("#wtabs button"),function(b){b.classList.toggle("active",b.getAttribute("data-tab")===t)});
  $("wCheat").hidden=t!=="cheat"; $("wPrac").hidden=t!=="prac"; $("wWrong").hidden=t!=="wrong"; $("wCards").hidden=t!=="cards"; $("wMine").hidden=t!=="mine";
  if(t==="prac") renderPrac(); else if(t==="wrong") renderWrong(); else if(t==="mine") renderMine(); else if(t==="cards") wgOpen();
}
function ensure(){
  var ps=[];
  if(!cheatLoaded) ps.push(fetch(bust("writing/cheatsheet.html"),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(h){$("wCheat").innerHTML=h;cheatLoaded=true;bindCheat()}).catch(function(e){$("wCheat").innerHTML='<div class="empty">速查表加载失败：'+esc(e.message)+"</div>"}));
  if(!loaded) ps.push(fetch(bust("writing/questions.json"),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    Q=(d.questions||[]).slice().sort(function(a,b){return (a.kind==="mock")-(b.kind==="mock")||a.round-b.round||a.no-b.no});
    byId={}; Q.forEach(function(q){byId[q.id]=q}); loaded=true; buildOrder(true); info();
  }).catch(function(e){$("wInfo").textContent="写作题库加载失败："+e.message}));
  if(!loaded) ps.push(fetch(bust("writing/mylog.json"),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.entries)LOG=d}).catch(function(){}));
  return Promise.all(ps);
}
function info(){
  var c=function(no,f){return Q.filter(function(q){return q.no===no&&f(q)}).length};
  var real=function(q){return q.kind!=="mock"}, mock=function(q){return q.kind==="mock"};
  $("wInfo").textContent="题库：51 真题 "+c(51,real)+" · 模拟 "+c(51,mock)+" ｜ 52 真题 "+c(52,real)+" · 模拟 "+c(52,mock);
}

/* 练习 */
function filtered(){
  return Q.filter(function(q){
    if(wrongOnly) return isWrong(q.id);
    if(opts.no!=="all"&&String(q.no)!==String(opts.no))return false;
    if(opts.src==="real"&&q.kind==="mock")return false;
    if(opts.src!=="all"&&opts.src!=="real"&&srcGroup(q)!==opts.src)return false;
    return true;
  });
}
function buildOrder(keep){
  var list=filtered(); order=opts.rnd?shuffle(list):list;
  idx=0;
  if(keep&&opts.cur){for(var i=0;i<order.length;i++)if(order[i].id===opts.cur){idx=i;break}}
  revealed=false;
}
function cnt(f){return Q.filter(f).length}
function segHTML(name,items,val){
  return '<div class="seg" data-seg="'+name+'">'+items.map(function(it){
    return '<button type="button" data-v="'+it[0]+'" class="'+(String(val)===String(it[0])?"active":"")+'"'+(it[2]===0?" disabled":"")+">"+it[1]+(it[2]!=null?" "+it[2]:"")+"</button>"}).join("")+"</div>";
}
function blankify(t){
  return esc(t).replace(/\(\s*㉠\s*\)/g,'<span class="blank">㉠</span>').replace(/\(\s*㉡\s*\)/g,'<span class="blank b">㉡</span>').replace(/\n/g,"<br>");
}
function renderPrac(){
  var box=$("wPrac"); if(!loaded){box.innerHTML='<div class="card empty">加载中…</div>';return}
  var noF=function(q){return opts.no==="all"||String(q.no)===String(opts.no)};
  var h="";
  if(wrongOnly){
    h+='<div class="seg"><button type="button" class="active" id="wExitWrong">只练错题模式（'+order.length+'）✕ 退出</button></div>';
  }else{
    h+=segHTML("no",[["all","全部",null],["51","51 实用文",null],["52","52 说明文",null]],opts.no);
    h+=segHTML("src",[["all","全部",cnt(noF)],["real","真题",cnt(function(q){return noF(q)&&q.kind!=="mock"})],["official","官方公开",cnt(function(q){return noF(q)&&srcGroup(q)==="official"})],["recalled","回忆版",cnt(function(q){return noF(q)&&srcGroup(q)==="recalled"})],["mock","模拟题",cnt(function(q){return noF(q)&&q.kind==="mock"})]],opts.src);
  }
  h+='<div class="wrow"><select id="wPick" aria-label="选择题目">'+order.map(function(q,i){var m=st.marks[q.id];
    return '<option value="'+i+'"'+(i===idx?" selected":"")+">"+(i+1)+". "+esc(srcLabel(q))+" · "+q.no+"番"+(m?(isWrong(q.id)?" ✗":" ✓"):"")+"</option>"}).join("")+'</select><label><input type="checkbox" id="wRnd"'+(opts.rnd?" checked":"")+"> 随机</label></div>";
  if(!order.length){box.innerHTML=h+'<div class="card empty">'+(wrongOnly?"没有错题了 🎉":(opts.src==="mock"?"模拟题暂时为空（真题已足够，之后可在 writing/questions.json 里添加 kind:\"mock\" 的题）":"没有符合条件的题"))+"</div>";bindPrac();return}
  var q=order[idx]; opts.cur=q.id; save();
  var d=drafts[q.id]||{a:"",b:""};
  h+='<div class="card" id="wCard"><div class="qhead"><span class="no">'+q.no+'번</span><span class="badge '+srcCls(q)+'">'+esc(srcLabel(q))+'</span><span class="badge">'+(q.no===51?"实用文 · -습니다":"说明文 · -(ㄴ/는)다")+"</span>"+'<span id="wMk">'+mkBadges(q.id)+'</span><span style="margin-left:auto;color:var(--muted);font-size:14px">'+(idx+1)+"/"+order.length+"</span></div>";
  if(q.title) h+='<div class="qtitle" lang="ko">'+esc(q.title)+"</div>";
  h+='<div class="passage" lang="ko">'+blankify(q.text)+"</div>";
  ["a","b"].forEach(function(k){
    h+='<div class="wfield"><div class="lab">'+(k==="a"?"㉠":"㉡")+"</div>"+mlHint(q.id,k)+
      '<textarea class="answer" id="wIn_'+k+'" lang="ko" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="写 '+(k==="a"?"㉠":"㉡")+' 的答案（一句话）…">'+esc(d[k]||"")+"</textarea></div>";
  });
  h+='<div class="actions"><button type="button" class="b-primary full" id="wShow">'+(revealed?"收起参考答案":"看参考答案")+'</button><button type="button" class="b-ghost full small" id="wCopy">📋 复制我的答案发给老师批改</button></div>';
  h+='<div id="wReveal"></div>';
  h+='<div class="wnav"><button type="button" class="btn small" id="wPrev"'+(idx===0?" disabled":"")+'>← 上一题</button><button type="button" class="btn b-primary small" id="wNext">'+(idx>=order.length-1?"回到第 1 题":"下一题 →")+"</button></div></div>";
  box.innerHTML=h; bindPrac(); if(revealed) renderReveal();
}
function renderReveal(){
  var q=order[idx], r=$("wReveal"); if(!q||!r)return;
  if(!revealed){r.innerHTML="";return}
  var m=st.marks[q.id]||{}, d=drafts[q.id]||{};
  var h='<div class="reveal">';
  ["a","b"].forEach(function(k){
    var L=k==="a"?"㉠":"㉡", ans=(q.ans&&q.ans[k])||[], alt=(q.alt&&q.alt[k])||[];
    h+='<div class="ansbox"><div class="h">'+L+' <span class="badge '+(q.ansType==="official"?"real":"rec")+'">'+ansLabel(q)+"</span></div>";
    h+=ans.map(function(a){return '<div class="model" lang="ko">'+esc(a)+"</div>"}).join("");
    if(alt.length) h+='<div style="font-size:12.5px;color:var(--muted);margin-top:6px">其他可行写法（自拟）</div>'+alt.map(function(a){return '<div class="model alt" lang="ko">· '+esc(a)+"</div>"}).join("");
    h+='<div class="mine">我的：<span lang="ko">'+(d[k]?esc(d[k]):"（未填写）")+"</span></div>";
    h+=mlBox(q.id,k);
    if(q.pat&&q.pat[k]) h+='<div class="pat">句型：'+esc(q.pat[k])+"</div>";
    if(q.exp&&q.exp[k]) h+='<div class="exp">💡 '+esc(q.exp[k])+"</div>";
    h+='<div class="marks" data-k="'+k+'">'+["full","part","none"].map(function(v){return '<button type="button" data-m="'+v+'" class="'+(m[k]===v?"on":"")+'">'+MK[v]+"</button>"}).join("")+"</div></div>";
  });
  if(q.zh) h+='<div class="zh"><b>中文翻译</b><br>'+esc(q.zh)+"</div>";

  r.innerHTML=h;
}
function saveDraft(){
  var q=order[idx]; if(!q)return;
  var a=$("wIn_a"), b=$("wIn_b"); if(!a||!b)return;
  drafts[q.id]={a:a.value,b:b.value}; if(!a.value&&!b.value) delete drafts[q.id]; save();
}
function go(i){drafts={}; idx=(i+order.length)%order.length; revealed=false; renderPrac(); try{$("wPrac").scrollIntoView({block:"start"})}catch(e){}}
function bindPrac(){
  var box=$("wPrac");
  box.onclick=function(e){
    var b=e.target.closest("button"); if(!b)return;
    var seg=b.closest(".seg[data-seg]");
    if(seg){opts[seg.getAttribute("data-seg")]=b.getAttribute("data-v");opts.cur=null;buildOrder(false);save();renderPrac();return}
    if(b.id==="wExitWrong"){wrongOnly=false;buildOrder(false);renderPrac();return}
    if(b.id==="wShow"){saveDraft();revealed=!revealed;b.textContent=revealed?"收起参考答案":"看参考答案";renderReveal();if(revealed){var r=$("wReveal");try{r.scrollIntoView({block:"start",behavior:"smooth"})}catch(x){}}return}
    if(b.id==="wCopy"){saveDraft();copyMine();return}
    if(b.id==="wPrev"){go(idx-1);return}
    if(b.id==="wNext"){go(idx+1);return}
    var mk=b.closest(".marks");
    if(mk){var q=order[idx],k=mk.getAttribute("data-k"),v=b.getAttribute("data-m");var m=st.marks[q.id]||{};m[k]=v;m.t=Date.now();st.marks[q.id]=m;save();
      Array.prototype.forEach.call(mk.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b)});
      $("wMk").innerHTML=mkBadges(q.id);
      if(m.a&&m.b) toast(isWrong(q.id)?"已记入写作错题":"两空都满分 👍");
    }
  };
  var p=$("wPick"); if(p) p.onchange=function(){go(+this.value)};
  var r=$("wRnd"); if(r) r.onchange=function(){saveDraft();opts.rnd=this.checked;opts.cur=null;buildOrder(false);save();renderPrac()};
  ["a","b"].forEach(function(k){var t=$("wIn_"+k);if(!t)return;
    var fit=function(){t.style.height="auto";t.style.height=Math.max(t.scrollHeight,64)+"px"};
    t.addEventListener("input",function(){fit();clearTimeout(t._s);t._s=setTimeout(saveDraft,300)});
    t.addEventListener("blur",saveDraft); fit();
  });
}
function copyMine(){
  var q=order[idx]; if(!q)return; var d=drafts[q.id]||{};
  var txt="【TOPIK II 写作】"+srcLabel(q)+" · 第"+q.no+"题（"+(q.no===51?"实用文":"说明文")+"）\n"+
    (q.title?"标题："+q.title+"\n":"")+"原文：\n"+q.text+"\n\n"+
    "㉠ 我的答案："+(d.a||"（未填写）")+"\n㉡ 我的答案："+(d.b||"（未填写）")+"\n\n请帮我批改语法、语体和是否符合上下文，谢谢！";
  copy(txt);
}

/* 个人易错记录（writing/mylog.json，老师批改后用 tools/add_mistake.py 追加） */
function mlOf(id,k){return LOG.entries.filter(function(e){return e.q===id&&(!k||e.k===k)}).sort(function(a,b){return a.try-b.try})}

function bindCheat(){
  var root=$("cs2"); if(!root) return;
  var q=$("csQ"), qx=$("csQx"), cur=opts.cst||"f";
  function show(t){cur=t;opts.cst=t;save();
    Array.prototype.forEach.call(root.querySelectorAll("#csTabs button"),function(b){b.classList.toggle("active",b.getAttribute("data-cst")===t)});
    Array.prototype.forEach.call(root.querySelectorAll(".cs-pane"),function(p){p.hidden=p.getAttribute("data-pane")!==t});}
  function filter(){
    var v=q.value.trim().toLowerCase(); qx.hidden=!v;
    var tabs=$("csTabs"); tabs.hidden=!!v;
    if(!v){Array.prototype.forEach.call(root.querySelectorAll(".cs-it"),function(e){e.hidden=false});
      Array.prototype.forEach.call(root.querySelectorAll(".cs-h,.fms,details.grp,.cs-lead"),function(e){e.hidden=false});
      Array.prototype.forEach.call(root.querySelectorAll("details.grp"),function(d){if(d._auto){d.open=false;d._auto=false}});
      $("csNone").hidden=true; show(cur); return}
    var terms=v.split(/\s+/), n=0;
    Array.prototype.forEach.call(root.querySelectorAll(".cs-pane"),function(p){p.hidden=p.getAttribute("data-pane")==="s"});
    Array.prototype.forEach.call(root.querySelectorAll(".cs-lead"),function(e){e.hidden=true});
    Array.prototype.forEach.call(root.querySelectorAll(".cs-it"),function(e){var s=e.getAttribute("data-s")||"";var ok=terms.every(function(t){return s.indexOf(t)>=0});e.hidden=!ok;if(ok)n++});
    Array.prototype.forEach.call(root.querySelectorAll("details.grp"),function(d){var any=d.querySelector(".cs-it:not([hidden])");d.hidden=!any;if(any&&!d.open){d.open=true;d._auto=true}});
    Array.prototype.forEach.call(root.querySelectorAll(".fms"),function(f){f.hidden=!f.querySelector(".cs-it:not([hidden])")});
    Array.prototype.forEach.call(root.querySelectorAll(".cs-h"),function(h){var nx=h.nextElementSibling,any=false;while(nx&&!nx.classList.contains("cs-h")){if(!nx.hidden&&(nx.matches(".cs-it:not([hidden])")||nx.querySelector(".cs-it:not([hidden])")))any=true;nx=nx.nextElementSibling}h.hidden=!any});
    $("csNone").hidden=n>0;
  }
  root.addEventListener("click",function(e){var b=e.target.closest("#csTabs button");if(b)show(b.getAttribute("data-cst"))});
  q.addEventListener("input",function(){clearTimeout(q._t);q._t=setTimeout(filter,120)});
  qx.onclick=function(){q.value="";filter();q.focus()};
  show(cur);
}

function wgNorm(s){s=String(s||"").replace(/[^\uac00-\ud7a3\u3131-\u318e/()]/g,"");return s}
function wgExpand(s){ // 把输入里的 (으)、아/어 展开成多个候选
  var out={}, todo=[String(s||"").replace(/\s+/g,"")], n=0;
  while(todo.length&&n++<200){var t=todo.pop(),m=t.match(/\(([^()]*)\)/);
    if(m){todo.push(t.replace(m[0],m[1]));todo.push(t.replace(m[0],""));continue}
    m=t.match(/([\uac00-\ud7a3\u3131-\u318e])\/([\uac00-\ud7a3\u3131-\u318e])/);
    if(m){todo.push(t.replace(m[0],m[1]));todo.push(t.replace(m[0],m[2]));continue}
    t=t.replace(/[^\uac00-\ud7a3\u3131-\u318e]/g,"").replace(/으ㄹ/g,"을").replace(/으ㄴ/g,"은").replace(/으ㅁ/g,"음").replace(/으ㅂ/g,"읍");
    if(t)out[t]=1}
  return Object.keys(out);
}
function wgCore(k){return k.replace(/^[아어여으을ㄹ은ㄴ는이가과와를]{1,2}/,"")}
function wgCheck(c,input){
  var cands=wgExpand(input); if(!cands.length) return false;
  var keys=c.keys||[], core={}; keys.forEach(function(k){core[wgCore(k)]=1});
  return cands.some(function(t){return keys.indexOf(t)>=0||(wgCore(t).length>=2&&core[wgCore(t)])});

    if(b.id==="wgExitRedo"){wgNewRound();wgRender();return}
    if(b.id==="wgShare"){copyLink();return}
    if(b.id==="wgClear"){if(confirm("确定清空语法错题本？")){wgW={};wgSaveW();if(wg.scope==="wrong")wgNewRound();wgRender();toast("已清空")}return}
    var a=b.getAttribute("data-a"), c=R.q[R.i]; if(!a) return;
    if(a==="check"){wgSubmit();return}
    if(a==="giveup"){R.typed=($("wgIn")||{}).value||"";R.st="bad";wgMark(c,false);wgRender();return}
    if(a==="actually"){R.bad--;R.ok++;R.missed.pop();var w=wgW[c.id];if(w){w.n--;if(w.n<=0)delete wgW[c.id];wgSaveW()}R.st="ok";toast("好的，算你对 👍");wgRender();return}
    if(a==="next"){wgNext();return}
    if(a==="show"){R.st="shown";wgRender();return}
    if(a==="know"){wgMark(c,true);wgNext();return}
    if(a==="dunno"){wgMark(c,false);R.st="bad";wgRender();return}
    if(a==="redo"){wgNewRound(R.missed.slice(),true);wgRender();return}
    if(a==="again"){wgNewRound();wgRender();return}
    if(a==="wrongbook"){wg.scope="wrong";wgSaveOpts();wgNewRound();wgRender();return}
  };
}

}

else if(hash==="mistakes"||WQS.writing==="mistakes"){opts.tab="mine";save();v0="writing"}   // 我的易错点：#mistakes 或 ?writing=mistakes
